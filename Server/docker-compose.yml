services:
  db:
    image: postgres:16-alpine
    container_name: nullborn-postgres
    environment:
      POSTGRES_USER: nullborn
      POSTGRES_PASSWORD: nullborn
      POSTGRES_DB: nullborn
    ports:
      - "5432:5432"
    volumes:
      - nullborn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullborn -d nullborn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nullborn_pgdata:
